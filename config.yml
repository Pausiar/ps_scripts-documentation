# Configuración básica del sitio
title: "PS Scripts Documentation"
description: "Documentación técnica premium para scripts de FiveM de PS Scripts"
baseurl: "/ps_scripts-documentation" # subpath del repositorio en GitHub Pages
url: "https://pausiar.github.io" # URL base esperada de GitHub Pages

# Información del autor
author:
  name: "Pausiar"
  email: ""
  github: "Pausiar"

# Configuración de GitHub Pages
repository: Pausiar/ps_scripts-documentation

# Jekyll settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Excluir archivos del build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Configuración adicional
timezone: Europe/Madrid
encoding: utf-8

# SEO
lang: es
locale: es_ES
